name: installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # weekly: catches upstream ISO, checksum or Ventoy URL changes
    - cron: "17 5 * * 1"

permissions:
  contents: read

defaults:
  run:
    working-directory: installer

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # pinned: newer shellcheck versions add and drop warnings
      - name: Install shellcheck
        run: pipx install shellcheck-py==0.11.0.1 && shellcheck --version

      - name: Kickstart %pre tests and shellcheck
        run: tests/test-kickstarts.sh --out "$RUNNER_TEMP/ks"

      # Each kickstart is validated with its own distro's pykickstart:
      # AlmaLinux patches the RHEL10 handler to allow btrfs.
      - name: ksvalidator (AlmaLinux)
        run: |
          source config.env
          docker run --rm -v "$RUNNER_TEMP/ks:/ks:ro" "quay.io/almalinuxorg/almalinux:$ALMA_MAJOR" \
            sh -c "dnf -yq install pykickstart >/dev/null && ksvalidator -v RHEL$ALMA_MAJOR /ks/alma.ks"

      - name: ksvalidator (Fedora)
        run: |
          source config.env
          docker run --rm -v "$RUNNER_TEMP/ks:/ks:ro" "registry.fedoraproject.org/fedora:$FEDORA_VERSION" \
            sh -c "dnf -yq install pykickstart >/dev/null && ksvalidator -v F$FEDORA_VERSION /ks/silverblue.ks"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kickstarts
          path: ${{ runner.temp }}/ks
          if-no-files-found: ignore

  build:
    # Builds a real stick image on a loop device: downloads Ventoy and both
    # ISOs (~2 GB), verifies checksums, installs Ventoy, copies files.
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Build stick image
        run: |
          truncate -s 8G "$RUNNER_TEMP/usb.img"
          LOOP=$(sudo losetup -fP --show "$RUNNER_TEMP/usb.img")
          echo "LOOP=$LOOP" >> "$GITHUB_ENV"
          # answers: build-usb.sh's "type the device name", then Ventoy's two y/n prompts
          printf '%s\ny\ny\n' "${LOOP##*/}" | ./build-usb.sh --device "$LOOP" --allow-loop

      - name: Check stick contents
        run: |
          source config.env
          sudo partprobe "$LOOP" && sudo udevadm settle
          [[ $(sudo blkid -s LABEL -o value "${LOOP}p1") == Ventoy ]]
          [[ $(sudo blkid -s LABEL -o value "${LOOP}p2") == VTOYEFI ]]
          mnt=$(mktemp -d)
          sudo mount -o ro "${LOOP}p1" "$mnt"
          find "$mnt" -type f -printf '%10s  %P\n' | sort -k2
          jq . "$mnt/ventoy/ventoy.json"
          for ks in alma silverblue; do
            test -s "$mnt/ventoy/$ks.ks"
            if grep -n '@[A-Z_]*@' "$mnt/ventoy/$ks.ks"; then echo "unfilled placeholder in $ks.ks"; exit 1; fi
          done
          grep -q "fedora-silverblue:$FEDORA_VERSION " "$mnt/ventoy/silverblue.ks"
          # every image ventoy.json refers to is on the stick
          jq -r '.auto_install[].image, .menu_alias[].image, .auto_install[].template[]' \
            "$mnt/ventoy/ventoy.json" | while read -r f; do test -s "$mnt$f" || { echo "missing $f"; exit 1; }; done
          # ISOs match the checksum-verified downloads
          for iso in "$mnt"/iso/*.iso; do cmp "$iso" ".cache/${iso##*/}"; done
          sudo umount "$mnt"

      - name: Detach loop device
        if: always()
        run: '[[ -z ${LOOP:-} ]] || sudo losetup -d "$LOOP"'

      # The release job publishes this once vm-install has passed.
      - name: Compress image and write release notes
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          source config.env
          dist=$RUNNER_TEMP/dist && mkdir -p "$dist"
          xz -T0 -6 -c "$RUNNER_TEMP/usb.img" > "$dist/mini-server-usb.img.xz"
          rm "$RUNNER_TEMP/usb.img"
          # GitHub release assets are limited to 2 GiB each
          if (( $(stat -c %s "$dist/mini-server-usb.img.xz") > 2000 * 1024 * 1024 )); then
            split -b 1900M -d -a 1 "$dist/mini-server-usb.img.xz" "$dist/mini-server-usb.img.xz.part"
            rm "$dist/mini-server-usb.img.xz"
            write="cat mini-server-usb.img.xz.part* | xz -dc | sudo dd of=/dev/sdX bs=4M conv=fsync status=progress"
          else
            write="xz -dc mini-server-usb.img.xz | sudo dd of=/dev/sdX bs=4M conv=fsync status=progress"
          fi
          (cd "$dist" && sha256sum mini-server-usb.img.xz* > SHA256SUMS)
          serials="not pinned: Alma goes on the first internal disk in kernel name order"
          [[ -z $ALMA_DISK_SERIAL ]] || serials="Alma \`$ALMA_DISK_SERIAL\`, Bazzite \`$BAZZITE_DISK_SERIAL\`"
          isos=$(cd .cache && ls *.iso | sed 's/.*/`&`/' | paste -sd, | sed 's/,/, /g')
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Ready-to-write installer stick image (8 GB), built from ${GITHUB_SHA::7} and tested by the full VM install.

          Write it to a stick of 8 GB or more (this **erases** the stick):

          \`\`\`
          sha256sum -c SHA256SUMS
          $write
          \`\`\`

          | | |
          |---|---|
          | ISOs | $isos |
          | Ventoy | $VENTOY_VERSION |
          | Bazzite image | \`$BAZZITE_IMAGE\` (Fedora $FEDORA_VERSION) |
          | Disk serials | $serials |

          To change any of these, edit \`installer/config.env\` and build your own stick with \`build-usb.sh\`.
          EOF
          mv "$RUNNER_TEMP/notes.md" "$dist/"
          ls -l "$dist"

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: usb-image
          path: ${{ runner.temp }}/dist
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  vm-install:
    # Full unattended install in QEMU/KVM: Alma, Silverblue, the rebase to
    # Bazzite, then Alma again. See tests/vm-install.sh. Takes 1-2 hours.
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 330
    concurrency:
      group: vm-install-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm

      - name: Install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends qemu-system-x86 qemu-utils ovmf xorriso jq

      # The two VM disks grow to ~40 GB (raid1 writes everything twice).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / /mnt || true
          best=$RUNNER_TEMP
          if mountpoint -q /mnt && [[ $(df --output=avail /mnt | tail -1) -gt $(df --output=avail "$RUNNER_TEMP" | tail -1) ]]; then
            best=/mnt
          fi
          sudo mkdir -p "$best/vm-ci" && sudo chown "$USER" "$best/vm-ci"
          echo "VM_WORK=$best/vm-ci" >> "$GITHUB_ENV"
          df -h "$best"

      - name: Prepare (ISOs, kickstarts, blank disks)
        run: tests/vm-install.sh --work "$VM_WORK" prepare

      - name: Install AlmaLinux
        run: tests/vm-install.sh --work "$VM_WORK" install-alma

      - name: Check AlmaLinux
        run: tests/vm-install.sh --work "$VM_WORK" check-alma

      - name: Install Silverblue
        run: tests/vm-install.sh --work "$VM_WORK" install-silverblue

      - name: Check Silverblue, wait for the rebase to Bazzite, check again
        run: tests/vm-install.sh --work "$VM_WORK" check-bazzite

      - name: Check AlmaLinux still boots
        run: tests/vm-install.sh --work "$VM_WORK" check-alma

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vm-install-logs
          path: ${{ env.VM_WORK }}/logs
          if-no-files-found: ignore

  release:
    # Replaces the rolling "usb-latest" release with the image from build,
    # but only once the full VM install has passed.
    needs: [build, vm-install]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-usb-latest
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: usb-image
          path: dist

      - name: Publish release
        run: |
          mv dist/notes.md notes.md
          if gh release view usb-latest >/dev/null 2>&1; then
            gh release delete usb-latest --cleanup-tag --yes
          fi
          gh release create usb-latest dist/* \
            --target "$GITHUB_SHA" \
            --title "Installer stick $(date -u +%F) (${GITHUB_SHA::7})" \
            --notes-file notes.md \
            --latest
